# Windows + .NET User Secrets. O arquivo fica fora do repositório e é somente leitura.
# Execute junto de compose.yaml após preencher os segredos pelo projeto Pelada.Api.
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HOME: /home/app
      PhotoStorage__Provider: S3
    volumes:
      - type: bind
        source: ${APPDATA:?APPDATA deve apontar para a pasta de dados do usuário Windows}/Microsoft/UserSecrets/pelada-manager-api/secrets.json
        target: /home/app/.microsoft/usersecrets/pelada-manager-api/secrets.json
        read_only: true
        bind:
          create_host_path: false
